name: Build RavenNest Unity Extractor APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "engine/**"
      - "native/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12 for Chaquopy buildPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Build native decoder libraries
        run: bash native/build_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: bash ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ravennest-unity-extractor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
